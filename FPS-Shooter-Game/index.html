<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arena Strike — 3D FPS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="overlay">
    <div id="menu" class="panel">
      <h1>Arena Strike</h1>
      <p class="tagline">First-person arena duel</p>
      <div class="controls">
        <span><kbd>↑</kbd><kbd>↓</kbd> Move</span>
        <span><kbd>←</kbd><kbd>→</kbd> Turn</span>
        <span><kbd>Space</kbd> Shoot</span>
      </div>
      <button id="start-btn" type="button">Enter Arena</button>
    </div>
    <div id="hud" class="hidden">
      <div class="hud-row">
        <div class="stat"><label>You</label><div class="bar"><div id="player-hp" class="fill player"></div></div></div>
        <div id="score">0</div>
        <div class="stat"><label>Bot</label><div class="bar"><div id="enemy-hp" class="fill enemy"></div></div></div>
      </div>
      <div id="message" class="toast hidden"></div>
    </div>
    <div id="gameover" class="panel hidden">
      <h2 id="result-title">Victory</h2>
      <p id="result-detail"></p>
      <button id="restart-btn" type="button">Play Again</button>
    </div>
  </div>
  <canvas id="game"></canvas>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
    }
  }
  </script>
  <script type="module" src="game.js"></script>
</body>
</html>
